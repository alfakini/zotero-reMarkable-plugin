name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run test:unit
      - run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: zotero-remarkable-sync
          path: .scaffold/build/*.xpi
